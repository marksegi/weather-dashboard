<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather Dashboard</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="container">
        <!-- Header -->
        <header class="header">
            <h1>🌤️ Weather Dashboard</h1>
            <p>Real-time weather information for any location</p>
        </header>

        <!-- Search Section -->
        <section class="search-section">
            <div class="search-box">
                <input 
                    type="text" 
                    id="cityInput" 
                    placeholder="Enter city name..." 
                    value="London"
                >
                <button id="searchBtn" class="btn btn-primary">Search</button>
            </div>
            <div id="error" class="error-message"></div>
        </section>

        <!-- Loading Spinner -->
        <div id="loading" class="loading" style="display: none;">
            <div class="spinner"></div>
            <p>Loading weather data...</p>
        </div>

        <!-- Current Weather Section -->
        <section id="currentWeatherSection" class="weather-section" style="display: none;">
            <div class="current-weather">
                <div class="weather-header">
                    <h2 id="cityName"></h2>
                    <p id="weatherDate"></p>
                </div>

                <div class="weather-main">
                    <div class="temperature-box">
                        <div class="temperature" id="temperature"></div>
                        <div class="weather-icon" id="weatherIcon"></div>
                    </div>
                    <div class="weather-description" id="weatherDescription"></div>
                </div>

                <div class="weather-details">
                    <div class="detail-item">
                        <span class="detail-label">Feels Like</span>
                        <span class="detail-value" id="feelsLike"></span>
                    </div>
                    <div class="detail-item">
                        <span class="detail-label">Humidity</span>
                        <span class="detail-value" id="humidity"></span>
                    </div>
                    <div class="detail-item">
                        <span class="detail-label">Pressure</span>
                        <span class="detail-value" id="pressure"></span>
                    </div>
                    <div class="detail-item">
                        <span class="detail-label">Wind Speed</span>
                        <span class="detail-value" id="windSpeed"></span>
                    </div>
                    <div class="detail-item">
                        <span class="detail-label">Visibility</span>
                        <span class="detail-value" id="visibility"></span>
                    </div>
                    <div class="detail-item">
                        <span class="detail-label">Cloud Coverage</span>
                        <span class="detail-value" id="clouds"></span>
                    </div>
                    <div class="detail-item">
                        <span class="detail-label">Sunrise</span>
                        <span class="detail-value" id="sunrise"></span>
                    </div>
                    <div class="detail-item">
                        <span class="detail-label">Sunset</span>
                        <span class="detail-value" id="sunset"></span>
                    </div>
                </div>
            </div>
        </section>

        <!-- Forecast Section -->
        <section id="forecastSection" class="forecast-section" style="display: none;">
            <h3>5-Day Forecast</h3>
            <div id="forecastContainer" class="forecast-grid"></div>
        </section>

        <!-- Footer -->
        <footer class="footer">
            <p>Data provided by OpenWeatherMap API</p>
            <p>&copy; 2024 Weather Dashboard. All rights reserved.</p>
        </footer>
    </div>

    <script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
